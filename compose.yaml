# ローカル開発用 PostgreSQL（AlloyDB 互換の代替）
# ドメインごとに DB を分ける: domain_a（domain-a-api）/ domain_b（domain-b-api）
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: domain_a
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

volumes:
  pgdata:
